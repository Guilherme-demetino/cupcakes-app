# Publicação no Render (https://render.com) – plano gratuito.
# No painel do Render: New → Blueprint → escolha este repositório → Apply.
services:
  - type: web
    name: cupcakeapp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Cria as tabelas e os dados de exemplo só na primeira vez; depois inicia o servidor.
    startCommand: flask --app run init-db --se-vazio && gunicorn run:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: cupcakeapp-db
          property: connectionString

databases:
  - name: cupcakeapp-db
    plan: free
    databaseName: cupcakeapp
    user: cupcakeapp
